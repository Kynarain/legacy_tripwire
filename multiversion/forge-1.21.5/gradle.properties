# ------------------------------------------------------------------------------------------------
# Gradle
# ------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ForgeGradle 7 merges the source sets for us (replaces the old output.resourcesDir hack).
net.minecraftforge.gradle.merge-source-sets=true

# ------------------------------------------------------------------------------------------------
# Minecraft / Forge
#   The Forge version must agree with the Minecraft version to get a valid artifact.
#   61.2.0 is the "recommended" build for 1.21.11, 61.2.1 is the latest at time of writing.
# ------------------------------------------------------------------------------------------------
minecraft_version=1.21.5
forge_version=55.1.13
forge_version_range=[55,)
loader_version_range=[55,)
minecraft_version_range=[1.21.5,1.22)

# ------------------------------------------------------------------------------------------------
# Mod metadata
# ------------------------------------------------------------------------------------------------
mod_id=legacy_tripwire
mod_name=Legacy Tripwire
mod_license=MIT
mod_version=1.0.0
mod_group_id=kynarain.cn
mod_authors=Kynarain
mod_description=Restores the pre-1.21.2 tripwire hook behaviour so classic string duper machines work again.
